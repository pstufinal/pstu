<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPulse — Peer-to-Peer Payments</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        stone: {
                            850: '#1c1917',
                            900: '#141210',
                            950: '#0c0a09',
                        },
                        cream: {
                            50: '#faf8f5',
                            100: '#f5f0eb',
                            200: '#e8ded4',
                            300: '#d7c7b8',
                            400: '#b8a493',
                            500: '#9c8673',
                            800: '#2a2622',
                            900: '#1a1815',
                            950: '#11100e',
                        },
                        accent: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-[#0f1113] text-[#e4e4e7] min-h-screen flex flex-col font-sans selection:bg-accent-500 selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="border-b border-[#24272c] bg-[#14171b]/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            
            <!-- Logo -->
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-accent-500 text-stone-950 flex items-center justify-center font-extrabold shadow-sm shadow-accent-500/20">
                    <svg class="w-5 h-5 text-stone-950" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <div>
                    <span class="text-lg font-extrabold tracking-tight text-white">PayPulse</span>
                </div>
            </div>

            <!-- Top Right: User State -->
            <div id="nav-authenticated" class="hidden flex items-center space-x-2.5 sm:space-x-3">
                
                <!-- Inbox Button with Badge -->
                <button id="btn-toggle-inbox" class="relative flex items-center space-x-1.5 text-xs bg-[#1a1e24] hover:bg-[#222730] text-[#d4d4d8] border border-[#2b303b] px-3 py-2 rounded-xl transition-all font-medium">
                    <svg class="w-4 h-4 text-accent-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
                    </svg>
                    <span>Inbox</span>
                    <span id="inbox-badge" class="hidden ml-0.5 px-1.5 py-0.2 rounded-full bg-accent-500 text-stone-950 font-bold text-[10px] animate-pulse">1</span>
                </button>

                <!-- User Identifier -->
                <div class="flex items-center space-x-2 bg-[#1a1e24] border border-[#2b303b] px-3 py-1.5 rounded-xl">
                    <span class="w-2 h-2 rounded-full bg-accent-400"></span>
                    <span id="nav-username" class="text-xs font-semibold text-white font-mono"></span>
                </div>

                <!-- Logout Button -->
                <button id="btn-logout" class="text-xs bg-stone-800/60 hover:bg-stone-800 text-[#a1a1aa] hover:text-rose-300 border border-[#2b303b] px-3 py-2 rounded-xl transition-colors font-medium">
                    Logout
                </button>
            </div>

            <!-- Unauthenticated Nav -->
            <div id="nav-unauthenticated" class="flex items-center space-x-2">
                <span class="text-xs text-[#71717a]">PSTU Hackathon 2026</span>
            </div>

        </div>
    </header>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 max-w-sm w-full px-4 pointer-events-none"></div>

    <!-- Main Content -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-8">

        <!-- ==================== AUTH VIEW (LOGIN / REGISTER) ==================== -->
        <section id="view-auth" class="max-w-md mx-auto my-12">
            <div class="bg-[#15181d] border border-[#262b33] rounded-3xl p-7 sm:p-8 shadow-2xl shadow-black/70">
                
                <!-- Auth Tabs -->
                <div class="flex border-b border-[#262b33] mb-6">
                    <button id="tab-login" class="flex-1 pb-3 text-sm font-semibold text-accent-400 border-b-2 border-accent-400 transition-colors">
                        Sign In
                    </button>
                    <button id="tab-register" class="flex-1 pb-3 text-sm font-semibold text-[#71717a] hover:text-[#d4d4d8] border-b-2 border-transparent transition-colors">
                        Create Account
                    </button>
                </div>

                <!-- Form Login -->
                <form id="form-login" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-[#a1a1aa] mb-1.5">Username</label>
                        <input type="text" id="login-username" required placeholder="e.g. alice"
                            class="w-full bg-[#0c0e11] border border-[#262b33] rounded-xl px-4 py-2.5 text-sm text-white placeholder-[#52525b] focus:outline-none focus:border-accent-500 focus:ring-1 focus:ring-accent-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-[#a1a1aa] mb-1.5">Password</label>
                        <input type="password" id="login-password" required placeholder="••••••••"
                            class="w-full bg-[#0c0e11] border border-[#262b33] rounded-xl px-4 py-2.5 text-sm text-white placeholder-[#52525b] focus:outline-none focus:border-accent-500 focus:ring-1 focus:ring-accent-500 transition">
                    </div>
                    <button type="submit" id="btn-login-submit"
                        class="w-full bg-accent-500 hover:bg-accent-400 text-stone-950 font-bold py-2.5 rounded-xl transition duration-150 shadow-md shadow-accent-500/10 flex items-center justify-center space-x-2 mt-2">
                        <span>Sign In</span>
                    </button>
                </form>

                <!-- Form Register -->
                <form id="form-register" class="space-y-4 hidden">
                    <div class="p-3 rounded-xl bg-accent-500/10 border border-accent-500/20 text-xs text-accent-300">
                        New accounts are auto-credited with <strong>৳100,000.00 BDT</strong>.
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-[#a1a1aa] mb-1.5">Desired Username</label>
                        <input type="text" id="register-username" required placeholder="e.g. bob"
                            class="w-full bg-[#0c0e11] border border-[#262b33] rounded-xl px-4 py-2.5 text-sm text-white placeholder-[#52525b] focus:outline-none focus:border-accent-500 focus:ring-1 focus:ring-accent-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-[#a1a1aa] mb-1.5">Password</label>
                        <input type="password" id="register-password" required placeholder="At least 6 characters"
                            class="w-full bg-[#0c0e11] border border-[#262b33] rounded-xl px-4 py-2.5 text-sm text-white placeholder-[#52525b] focus:outline-none focus:border-accent-500 focus:ring-1 focus:ring-accent-500 transition">
                    </div>
                    <button type="submit" id="btn-register-submit"
                        class="w-full bg-accent-500 hover:bg-accent-400 text-stone-950 font-bold py-2.5 rounded-xl transition duration-150 shadow-md shadow-accent-500/10 flex items-center justify-center space-x-2 mt-2">
                        <span>Create & Open Wallet</span>
                    </button>
                </form>
            </div>
        </section>

        <!-- ==================== DASHBOARD VIEW ==================== -->
        <section id="view-dashboard" class="hidden space-y-6">
            
            <!-- 1. Minimalist Account Balance Card -->
            <div class="bg-[#15181d] border border-[#262b33] rounded-3xl p-6 sm:p-7 shadow-xl">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-medium uppercase tracking-wider text-[#a1a1aa]">
                        Total Account Balance
                    </span>
                    <button id="btn-refresh-balance" class="text-xs text-[#a1a1aa] hover:text-white flex items-center space-x-1.5 bg-[#1f2329] hover:bg-[#282d35] px-2.5 py-1.5 rounded-lg border border-[#2e343f] transition">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                        <span>Refresh</span>
                    </button>
                </div>

                <div class="flex items-baseline space-x-2.5">
                    <span class="text-4xl sm:text-5xl font-extrabold font-mono text-white tracking-tight" id="dash-balance">৳ 0.00</span>
                    <span class="text-xs font-semibold px-2 py-0.5 rounded-md bg-accent-500/15 text-accent-400 border border-accent-500/20">BDT</span>
                </div>
            </div>

            <!-- 2. Transfer & Requests Main Area -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- Left: Send Money Card -->
                <div class="bg-[#15181d] border border-[#262b33] rounded-3xl p-6 shadow-xl flex flex-col justify-between">
                    <div>
                        <div class="flex items-center space-x-2.5 mb-5 pb-3 border-b border-[#242830]">
                            <div class="w-7 h-7 rounded-lg bg-accent-500/10 text-accent-400 flex items-center justify-center">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                            </div>
                            <h3 class="text-sm font-bold text-white">Send Money</h3>
                        </div>

                        <form id="form-send" class="space-y-3.5">
                            <div>
                                <label class="block text-xs font-medium text-[#a1a1aa] mb-1">Recipient Username</label>
                                <input type="text" id="send-recipient" required placeholder="e.g. bob"
                                    class="w-full bg-[#0c0e11] border border-[#262b33] rounded-xl px-3.5 py-2 text-sm text-white placeholder-[#52525b] focus:outline-none focus:border-accent-500 transition">
                            </div>
                            <div>
                                <div class="flex items-center justify-between mb-1">
                                    <label class="text-xs font-medium text-[#a1a1aa]">Amount (BDT)</label>
                                    <div class="flex space-x-1">
                                        <button type="button" onclick="setSendAmount(500)" class="text-[10px] px-1.5 py-0.5 rounded bg-[#1e2229] hover:bg-[#282d37] text-[#d4d4d8] transition">+500</button>
                                        <button type="button" onclick="setSendAmount(1200)" class="text-[10px] px-1.5 py-0.5 rounded bg-[#1e2229] hover:bg-[#282d37] text-[#d4d4d8] transition">+1,200</button>
                                        <button type="button" onclick="setSendAmount(2500)" class="text-[10px] px-1.5 py-0.5 rounded bg-accent-500/20 text-accent-300 font-semibold border border-accent-500/30 transition">+2,500</button>
                                    </div>
                                </div>
                                <div class="relative">
                                    <span class="absolute left-3.5 top-2 text-[#71717a] font-mono text-sm">৳</span>
                                    <input type="number" step="0.01" min="0.01" id="send-amount" required placeholder="2500.00"
                                        class="w-full bg-[#0c0e11] border border-[#262b33] rounded-xl pl-8 pr-3.5 py-2 text-sm text-white placeholder-[#52525b] focus:outline-none focus:border-accent-500 font-mono transition">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-[#a1a1aa] mb-1">Note (Optional)</label>
                                <input type="text" id="send-note" placeholder="e.g. Lunch"
                                    class="w-full bg-[#0c0e11] border border-[#262b33] rounded-xl px-3.5 py-2 text-sm text-white placeholder-[#52525b] focus:outline-none focus:border-accent-500 transition">
                            </div>
                            
                            <div class="pt-2">
                                <button type="submit" id="btn-send-submit"
                                    class="w-full bg-accent-500 hover:bg-accent-400 text-stone-950 font-bold py-2.5 rounded-xl transition shadow-md shadow-accent-500/10 flex items-center justify-center space-x-1.5 text-xs">
                                    <span>Send Money</span>
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Right: Receive / Request Money & Pending Requests -->
                <div class="bg-[#15181d] border border-[#262b33] rounded-3xl p-6 shadow-xl flex flex-col justify-between">
                    <div>
                        <!-- Tabs for Request New vs View Pending -->
                        <div class="flex items-center justify-between mb-4 pb-3 border-b border-[#242830]">
                            <div class="flex space-x-3 text-xs font-bold">
                                <button id="tab-req-form" class="text-white border-b-2 border-accent-400 pb-1">
                                    Request Money
                                </button>
                                <button id="tab-req-list" class="text-[#71717a] hover:text-white pb-1 transition-colors">
                                    Pending (<span id="incoming-count-badge">0</span>)
                                </button>
                            </div>
                            <button id="btn-refresh-requests" class="text-xs text-[#a1a1aa] hover:text-white p-1 rounded-lg bg-[#1e2229] transition">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                            </button>
                        </div>

                        <!-- 1. Request Form Panel -->
                        <div id="panel-req-form">
                            <form id="form-request" class="space-y-3.5">
                                <div>
                                    <label class="block text-xs font-medium text-[#a1a1aa] mb-1">Payer Username</label>
                                    <input type="text" id="req-payer" required placeholder="e.g. alice"
                                        class="w-full bg-[#0c0e11] border border-[#262b33] rounded-xl px-3.5 py-2 text-sm text-white placeholder-[#52525b] focus:outline-none focus:border-accent-500 transition">
                                </div>
                                <div>
                                    <div class="flex items-center justify-between mb-1">
                                        <label class="text-xs font-medium text-[#a1a1aa]">Amount to Collect (BDT)</label>
                                        <div class="flex space-x-1">
                                            <button type="button" onclick="setRequestAmount(500)" class="text-[10px] px-1.5 py-0.5 rounded bg-[#1e2229] hover:bg-[#282d37] text-[#d4d4d8] transition">+500</button>
                                            <button type="button" onclick="setRequestAmount(1200)" class="text-[10px] px-1.5 py-0.5 rounded bg-accent-500/20 text-accent-300 font-semibold border border-accent-500/30 transition">+1,200</button>
                                            <button type="button" onclick="setRequestAmount(2500)" class="text-[10px] px-1.5 py-0.5 rounded bg-[#1e2229] hover:bg-[#282d37] text-[#d4d4d8] transition">+2,500</button>
                                        </div>
                                    </div>
                                    <div class="relative">
                                        <span class="absolute left-3.5 top-2 text-[#71717a] font-mono text-sm">৳</span>
                                        <input type="number" step="0.01" min="0.01" id="req-amount" required placeholder="1200.00"
                                            class="w-full bg-[#0c0e11] border border-[#262b33] rounded-xl pl-8 pr-3.5 py-2 text-sm text-white placeholder-[#52525b] focus:outline-none focus:border-accent-500 font-mono transition">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-[#a1a1aa] mb-1">Reason / Note</label>
                                    <input type="text" id="req-note" placeholder="e.g. Dinner share"
                                        class="w-full bg-[#0c0e11] border border-[#262b33] rounded-xl px-3.5 py-2 text-sm text-white placeholder-[#52525b] focus:outline-none focus:border-accent-500 transition">
                                </div>
                                
                                <div class="pt-2">
                                    <button type="submit" id="btn-request-submit"
                                        class="w-full bg-[#20252d] hover:bg-[#2b313c] text-accent-300 border border-accent-500/30 font-bold py-2.5 rounded-xl transition flex items-center justify-center space-x-1.5 text-xs">
                                        <span>Create Payment Request</span>
                                    </button>
                                </div>
                            </form>
                        </div>

                        <!-- 2. Pending Requests List Panel -->
                        <div id="panel-req-list" class="hidden space-y-2.5 max-h-64 overflow-y-auto pr-1">
                            <div id="container-incoming-requests" class="space-y-2">
                                <div class="text-center py-8 text-[#71717a] text-xs">No pending requests to pay.</div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </section>

    </main>

    <!-- ==================== INBOX SLIDE-OVER DRAWER ==================== -->
    <div id="drawer-inbox" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex justify-end transition-opacity">
        <div class="bg-[#14171b] border-l border-[#262b33] w-full max-w-md h-full flex flex-col shadow-2xl p-6 space-y-4 animate-slide-left overflow-hidden">
            
            <!-- Drawer Header -->
            <div class="flex items-center justify-between border-b border-[#242830] pb-3">
                <div class="flex items-center space-x-2">
                    <div class="w-7 h-7 rounded-lg bg-accent-500/10 text-accent-400 flex items-center justify-center">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-white">Recent Transactions</h3>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button id="btn-mark-inbox-read" class="text-[10px] text-[#a1a1aa] hover:text-white px-2 py-1 bg-[#1e2229] rounded-lg transition">
                        Clear (0)
                    </button>
                    <button id="btn-close-inbox" class="text-[#a1a1aa] hover:text-white p-1 rounded-lg hover:bg-[#1e2229] transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
            </div>

            <!-- Filter Pills -->
            <div class="flex items-center justify-between">
                <div class="flex bg-[#0c0e11] p-1 rounded-xl border border-[#242830] text-[11px]">
                    <button id="filter-all" class="px-2 py-0.5 rounded-lg bg-[#1f2329] text-white font-medium">All</button>
                    <button id="filter-debits" class="px-2 py-0.5 rounded-lg text-[#71717a] hover:text-rose-400">Sent (-)</button>
                    <button id="filter-credits" class="px-2 py-0.5 rounded-lg text-[#71717a] hover:text-accent-400">Received (+)</button>
                </div>
                <span id="inbox-total-count" class="text-[11px] font-mono text-[#71717a]">0 items</span>
            </div>

            <!-- Inbox Items List Container -->
            <div id="inbox-items-container" class="flex-1 overflow-y-auto space-y-2 pr-1 font-mono text-xs">
                <div class="text-center py-12 text-[#71717a] text-xs font-sans">
                    No transactions yet. Complete a transfer to see it appear here.
                </div>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-[#1c1f24] py-5 text-center text-xs text-[#52525b]">
        <p>PayPulse • Money Movement Engine</p>
    </footer>

    <!-- App JavaScript -->
    <script src="/app.js"></script>
</body>
</html>
